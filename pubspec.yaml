name: rekeens_flutter_cli
description: CLI tool for scaffolding Flutter applications with Feature-First Clean Architecture, Riverpod/BLoC, GoRouter, Dio, and modular code generators.
version: 0.26.1
repository: https://github.com/igorsmoleac/rekeens_flutter_cli
issue_tracker: https://github.com/igorsmoleac/rekeens_flutter_cli/issues
homepage: https://github.com/igorsmoleac/rekeens_flutter_cli
documentation: https://github.com/igorsmoleac/rekeens_flutter_cli/blob/main/DOCUMENTATION.md

topics:
  - flutter-cli
  - code-generation
  - clean-architecture
  - scaffolding
  - developer-tools

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  mason_logger: ^0.3.5
  meta: ^1.16.0
  path: ^1.9.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
  coverage: ^1.7.2

executables:
  rekeens: rekeens_flutter_cli
