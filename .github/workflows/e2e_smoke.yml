name: E2E Smoke

# End-to-end smoke test of the full `rekeens create` pipeline.
# Scaffolds a real Flutter project for EVERY preset (minimal, mobile, full),
# then runs `flutter analyze` and `flutter test` inside each generated project.
#
# Each preset exercises a different combination of conditional template blocks
# ({{#if}} / {{#unless}} on state_management, router, networking, localization,
# codegen). A bug in the `none` branches — only hit by the `minimal` preset —
# would go unnoticed if only `--preset=full` were tested, so all three presets
# are covered as a matrix.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  smoke:
    name: create (${{ matrix.preset }}) + analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, mobile, full]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub dependencies (CLI)
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cli-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cli-

      - name: Install CLI dependencies
        run: dart pub get

      - name: Activate CLI globally
        run: dart pub global activate --source path .

      - name: Verify CLI is on PATH
        run: rekeens --version

      - name: Scaffold project with --preset=${{ matrix.preset }}
        run: rekeens create smoke_app --preset=${{ matrix.preset }}

      - name: Flutter analyze (generated project)
        working-directory: smoke_app
        run: flutter analyze

      - name: Flutter test (generated project)
        working-directory: smoke_app
        run: flutter test
